/* Immersive trip-generation interlude */
.plan-overlay{position:fixed;z-index:9999;inset:0;background:#102b24;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.plan-overlay:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 40% 38%,#367b6177,transparent 42%),radial-gradient(circle at 80% 75%,#d9a47a44,transparent 40%);animation:planGlow 8s ease-in-out infinite alternate}
.plan-inner{position:relative;z-index:1;width:min(100%,380px);text-align:center}
.plan-orbit{position:relative;width:176px;height:176px;margin:0 auto 35px;display:grid;place-items:center}
.plan-ring{position:absolute;inset:0;border:1px solid #ffffff33;border-radius:50%;animation:planSpin 10s linear infinite}
.plan-ring:after{content:"✦";position:absolute;top:-11px;left:50%;color:#e7b68e;font-size:24px}
.plan-ring.two{inset:17px;border-style:dashed;animation-direction:reverse;animation-duration:14s}
.plan-core{width:105px;height:105px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(140deg,#e6bd96,#c77b64);box-shadow:0 0 60px #e6bd9650;animation:planBreathe 2.6s ease-in-out infinite}
.plan-core svg{width:53px;height:53px;fill:none;stroke:#193b30;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.plan-kicker{font-size:11px;letter-spacing:3px;font-weight:800;color:#e7b68e}
.plan-heading{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:34px;line-height:1.13;margin:12px 0}
.plan-copy{font-size:14px;color:#c1d3ca;line-height:1.55;min-height:45px;margin:0 0 26px}
.plan-track{height:5px;background:#ffffff29;border-radius:99px;overflow:hidden}
.plan-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#e6bd96,#fff0cf);transition:width .45s ease}
.plan-meta{display:flex;justify-content:space-between;color:#b8cfc1;font-size:11px;margin-top:12px}
.plan-steps{display:flex;justify-content:center;gap:8px;margin-top:24px}.plan-steps span{width:7px;height:7px;border-radius:50%;background:#ffffff40}.plan-steps span.active{background:#e7b68e;box-shadow:0 0 12px #e7b68e}
.plan-cancel{margin-top:30px;color:#c1d3ca;border:1px solid #ffffff44;background:transparent;border-radius:99px;padding:10px 22px;font-size:13px}
@keyframes planSpin{to{transform:rotate(360deg)}}@keyframes planBreathe{50%{transform:scale(1.07);box-shadow:0 0 80px #e6bd9670}}@keyframes planGlow{to{transform:translate(8%, -5%)}}
@media(prefers-reduced-motion:reduce){.plan-ring,.plan-core,.plan-overlay:before{animation:none}.plan-fill{transition:none}}

/* In-page generation state: no overlay or modal */
.planning-inline{margin:22px 0 8px;padding:25px 18px 20px;background:transparent;border:0;border-radius:20px;text-align:center;min-height:245px;display:flex;align-items:center;flex-direction:column;justify-content:center}
.planning-inline-top{display:flex;align-items:center;gap:10px;color:#555;font-size:10px;font-weight:800;letter-spacing:1.5px}
.planning-spinner{width:19px;height:19px;border-radius:50%;border:2.5px solid #e4e4e4;border-top-color:#252525;animation:planningRotate .8s linear infinite}
.planning-inline-emoji{font-size:38px;margin:15px 0 5px;animation:planningFloat 1.6s ease-in-out infinite}
.planning-inline-title{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:23px;line-height:1.2;margin:5px 0 7px}
.planning-inline-copy{color:#777;font-size:13px;line-height:1.5;margin:0;min-height:38px}
.planning-inline-dots{display:flex;gap:7px;margin:15px 0 8px}
.planning-inline-dots span{width:7px;height:7px;border-radius:50%;background:#e2e2e2;transition:background .2s}
.planning-inline-dots span.active{background:#292929}
.planning-inline-cancel{border:0;background:transparent;color:#667b6b;text-decoration:underline;font-size:12px;padding:7px}
@keyframes planningRotate{to{transform:rotate(360deg)}}
@keyframes planningFloat{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.planning-spinner,.planning-inline-emoji{animation:none}}

.trip-style-heading{flex:1;min-width:0}.trip-style-heading .eyebrow{font-size:9px;letter-spacing:1.4px}.trip-style-heading strong{display:block;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:19px;font-weight:600;margin-top:3px}
.trip-style-edit{border:1px solid #d9e3d9;border-radius:99px;background:#fff;color:var(--accent);font-size:12px;font-weight:750;padding:9px 12px;white-space:nowrap}

/* Single destination hero + personalized style component */
.trip-hero-unified{border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 5px 22px #1111110a;margin-top:16px}

.trip-hero-unified .trip-style-heading strong{font-size:18px}

/* Compact trip hero with always-accessible style editing */
.trip-hero-unified .trip-hero-photo .heroText{bottom:14px}
.trip-hero-unified .trip-hero-photo h2{font-size:29px;line-height:1.08}
.trip-hero-unified .trip-hero-dates{margin-top:5px}
.trip-style-compact{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);min-height:64px}
.trip-style-compact-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

.trip-style-compact-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.trip-style-compact-label{font-size:9px;letter-spacing:1.2px;font-weight:750;color:var(--muted)}
.trip-style-compact-summary{font-size:12px;color:var(--ink);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.trip-style-compact-edit{flex-shrink:0;border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 13px;color:var(--accent);font-size:12px;font-weight:750;cursor:pointer}

/* Compact itinerary actions and revision history */
.trip-header-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.trip-action-icon{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:19px}
.trip-action-icon:focus-visible,.revision-item:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.revision-item{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.revision-icon{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}
.revision-copy{flex:1;min-width:0}.revision-copy strong{display:block;font-size:13px}.revision-copy small{display:block;color:var(--muted);margin-top:4px;font-size:11px}
.revision-current{font-size:11px;color:var(--accent);font-weight:700}
/* Lightweight itinerary heading: no image, card, or duplicated title. */
.trip-heading-simple{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:5px}

.trip-heading-period{color:var(--accent)}
.trip-dates-simple{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.trip-style-edit-inline{display:flex;align-items:center;gap:5px;white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:99px;padding:10px 12px;color:var(--accent);font-size:12px;font-weight:750}
.trip-style-inline-summary{font-size:12px;color:var(--muted);margin:12px 0 4px;line-height:1.5}

function wizard(){let step=S.wizardStep;let headers=[['What kind of trip feels right?','A few quick choices help us shape your days.'],['Your travel rhythm','We will plan your activities, lunch, and dinner around your style.'],['Anything else on your mind?','Completely optional. Tell the AI anything you want it to know.']];return `<main class="screen"><button class="btn ghost" style="padding:9px 12px;margin:4px 0 22px" onclick="${step===0?"go('home')":"wizardNext(-1)"}"><i data-lucide="arrow-left" aria-hidden="true"></i> Back</button><div class="eyebrow">YOUR ${esc(S.destination.toUpperCase())} TRIP · STEP ${step+1} OF 3</div><div class="wizard-progress">${[0,1,2].map(i=>`<span class="${i<=step?'filled':''}"></span>`).join('')}</div><h1 class="title">${headers[step][0]}</h1><p class="sub">${headers[step][1]}</p>${step===0?`<div class="panel"><label class="field">What are you most excited about? <span class="muted small">(pick any)</span></label><div class="chips">${['Local food','Landmarks','Art & museums','Nature','Romance','Shopping','Nightlife','Hidden gems'].map(x=>`<button class="chip ${S.interests.includes(x)?'active':''}" onclick="toggleInterest('${x}')">${x}</button>`).join('')}</div><label class="field">The overall vibe</label><div class="chips">${['Romantic','Adventure','Cultural','Relaxed','Family-friendly'].map(x=>`<button class="chip ${S.theme===x?'active':''}" onclick="wizardChoice('theme','${x}')">${x}</button>`).join('')}</div></div>`:step===1?`<div class="panel"><label class="field">Daily budget (excluding hotel and flights)</label><div class="chips">${['Budget','Moderate','Comfortable','Luxury'].map(x=>`<button class="chip ${S.budget===x?'active':''}" onclick="wizardChoice('budget','${x}')">${x}</button>`).join('')}</div><label class="field">How full should each day be?</label><div class="chips">${['Relaxed','Balanced','Packed'].map(x=>`<button class="chip ${S.pace===x?'active':''}" onclick="wizardChoice('pace','${x}')">${x}</button>`).join('')}</div><label class="field">Food preferences</label><div class="chips">${['Anything','Vegetarian','Vegan','Halal','Kosher'].map(x=>`<button class="chip ${S.diet===x?'active':''}" onclick="wizardChoice('diet','${x}')">${x}</button>`).join('')}</div><p class="small muted">Every day includes breakfast, lunch, and dinner. Dietary suitability must be verified before visiting.</p></div>`:`<div class="panel"><div class="row"><strong><i data-lucide="sparkles" aria-hidden="true"></i> Tell your AI planner</strong><span class="tag">Optional</span></div><p class="sub">Specific places, accessibility needs, children, food preferences, things to avoid, or anything that would make this trip special.</p><textarea id="wizardNotes" class="input" style="min-height:155px;resize:vertical;line-height:1.6" placeholder="e.g. We love sunset views, prefer local restaurants, want a relaxed afternoon, and would love a special dinner on day 2..." oninput="S.notes=this.value">${esc(S.notes)}</textarea><p class="small muted">You can leave this empty and still get a complete trip.</p><div class="panel" style="background:var(--soft);margin-bottom:0"><strong class="small">Your trip brief</strong><p class="small">${formatDate(S.startDate)} – ${formatDate(S.endDate)} · ${esc(S.days)} days in ${esc(S.destination)} · ${esc(S.travelers)}${S.travelers==='Family'?' · '+esc(kidsSummary()):''} · ${esc(S.theme)} · ${esc(S.pace)} pace · ${esc(S.budget)} budget</p><p class="small muted">${esc(S.interests.join(' · ')||'Balanced activities')} · ${esc(S.diet)} food</p></div></div>`}${`<div style="margin-top:22px"><button class="btn full" onclick="${step===2?'beginPlanning()':'wizardNext(1)'}">${step===2?'<i data-lucide="sparkles" aria-hidden="true"></i> Create my complete trip <i data-lucide="arrow-right" aria-hidden="true"></i>':'Continue <i data-lucide="arrow-right" aria-hidden="true"></i>'}</button>${step===2?`<button class="btn ghost full" style="margin-top:10px" onclick="skipWizardNotes()">Skip AI instructions & generate</button>`:''}</div>`}<p class="footerNote">No account or subscription required. Demo planning is simulated with local data; Gemini is not connected.</p></main>`}

function beginPlanning(){if(S.generating||!validDates())return;S.generating=true;S.planStage=0;S.page='planning';render();window.scrollTo(0,0);let stage=0;clearInterval(planTimer);planTimer=setInterval(()=>{if(!S.generating){clearInterval(planTimer);return}stage++;if(stage>=planMessages.length){clearInterval(planTimer);planTimer=null;S.generating=false;generate();return}S.planStage=stage;render()},1050)}

function generate(){if(!validDates())return;S.destination=($('destination')?.value||S.destination).trim()||'Paris';S.activities=structuredClone(seed).filter(a=>a.day<=S.days);for(let d=6;d<=S.days;d++){for(const [type,time,title] of [['breakfast','09:00','Breakfast at a local café'],['lunch','13:00','Lunch near your activities'],['dinner','19:00','Dinner in the city']])S.activities.push({id:'extra'+d+type,day:d,time,title,desc:'Suggested meal · Venue unverified',category:'food',mealType:type,locked:false})}if(S.travelers==='Family'&&S.hasKids===true){const younger=S.kidAges.some(a=>['0–2','3–5'].includes(a));S.activities=S.activities.map(a=>{if(a.category==='food')return {...a,desc:'Family-friendly meal suggestion · Venue and child facilities unverified'};if(younger&&a.category==='culture')return {...a,desc:'Short family-friendly visit · Accessibility and age suitability unverified'};return a});if(younger)S.activities=S.activities.filter(a=>a.category==='food'||!['a3','a8'].includes(a.id))}if(S.pace==='Relaxed')S.activities=S.activities.filter(a=>a.category==='food'||!['a3','a8'].includes(a.id));if(S.interests.includes('Romance')||S.theme==='Romantic'||/romantic|sunset|special dinner/i.test(S.notes)){let d=S.activities.find(a=>a.id==='meal2d');if(d){d.title='Romantic dinner in Montmartre';d.desc='Intimate restaurant · 90 min · Venue unverified'}}S.activeTripId=uid();S.tripSource='custom';S.tripCreated=true;S.generationCount++;S.templates++;S.revision=1;S.history=[];S.revisionLog=[];S.day=1;S.page='trip';render();toast('Trip generated from reusable sample itinerary <i data-lucide="sparkles" aria-hidden="true"></i>')}
function trip(){return `<main class="screen"><header class="trip-heading-simple"><div class="trip-heading-main"><div class="eyebrow">YOUR ITINERARY</div><h1 class="trip-destination">${esc(S.destination)} awaits<span class="trip-heading-period">.</span></h1><p class="trip-dates-simple">${formatDate(S.startDate)} – ${formatDate(S.endDate)} <span aria-hidden="true">·</span> ${S.days} days</p></div><button class="trip-style-edit-inline" onclick="openSheet('preferences')" aria-label="Edit trip style"><span aria-hidden="true"><i data-lucide="sparkles" aria-hidden="true"></i></span> Edit style <span aria-hidden="true"><i data-lucide="arrow-up-right" aria-hidden="true"></i></span></button></header><div class="trip-style-inline-summary">${esc(S.pace)} pace <span aria-hidden="true">·</span> ${esc(S.theme)} <span aria-hidden="true">·</span> ${esc(S.budget)} budget</div><div class="tabs"><button class="tab ${S.view==='timeline'?'active':''}" onclick="S.view='timeline';render()"><i data-lucide="list" aria-hidden="true"></i> Timeline</button><button class="tab ${S.view==='map'?'active':''}" onclick="S.view='map';render()"><i data-lucide="map-pin" aria-hidden="true"></i> Map</button></div><div class="daystrip">${Array.from({length:S.days},(_,i)=>`<button class="day ${S.day===i+1?'active':''}" onclick="S.day=${i+1};render()">DAY<strong>${i+1}</strong><span style="display:block;font-size:10px;margin-top:4px">${formatDate(new Date(dateUTC(S.startDate)+i*86400000).toISOString().slice(0,10))}</span></button>`).join('')}</div><div class="row"><div><h2 class="sectionTitle" style="margin:7px 0">${S.day===2?'Montmartre & magic':S.day===1?'The Paris classics':'Explore at your pace'}</h2></div><button class="iconbtn" onclick="openSheet('ai')"><i data-lucide="sparkles" aria-hidden="true"></i></button></div>${S.view==='map'?mapView():timeline()}<div class="panel"><div class="row"><div><strong><i data-lucide="sparkles" aria-hidden="true"></i> Your trip, intelligently edited</strong><p class="small muted">Change anything. Keep what you love.</p></div></div><button class="btn full" onclick="openSheet('ai')">Ask AI to reimagine this day <i data-lucide="arrow-right" aria-hidden="true"></i></button></div><p class="footerNote">Demo activities and routes are illustrative. Hours, reservations and travel times are not live verified.</p></main>`}

function initRealMap(){
 const el=document.getElementById('real-trip-map');if(!el)return;
 if(typeof maplibregl==='undefined'){el.innerHTML='<div class="map-status">Map unavailable. Check your internet connection and reload.</div>';return}
 if(roamMap){roamMap.remove();roamMap=null}
 el.innerHTML='';
 roamMap=new maplibregl.Map({container:el,style:'https://tiles.openfreemap.org/styles/positron',center:[2.3376,48.8606],zoom:12,attributionControl:true});
 roamMap.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
 const isParis=S.destination.trim().toLowerCase()==='paris';
 if(!isParis){el.insertAdjacentHTML('afterend','<p class="map-note">This prototype only has mapped locations for Paris. Other destinations need geocoding before pins can be shown.</p>');return}
 const positions=[];
 dayActs().forEach((a,i)=>{const coords=parisMapPoints[a.id];if(!coords)return;
  const lngLat=[coords[1],coords[0]];positions.push(lngLat);
  const wrap=document.createElement('div');const name=document.createElement('strong');name.textContent=`${i+1}. ${a.title}`;wrap.appendChild(name);wrap.appendChild(document.createElement('br'));
  const time=document.createElement('span');time.textContent=a.time+' · Approximate location';wrap.appendChild(time);wrap.appendChild(document.createElement('br'));
  const open=document.createElement('button');open.textContent='View activity <i data-lucide="arrow-right" aria-hidden="true"></i>';open.style.cssText='margin-top:8px;border:0;background:#225e4b;color:white;border-radius:8px;padding:8px 10px;cursor:pointer';open.addEventListener('click',()=>{S.selected=a.id;openSheet('activity')});wrap.appendChild(open);
  new maplibregl.Marker().setLngLat(lngLat).setPopup(new maplibregl.Popup({offset:22}).setDOMContent(wrap)).addTo(roamMap);
 });
 if(positions.length>1){
  const bounds=new maplibregl.LngLatBounds(positions[0],positions[0]);positions.forEach(p=>bounds.extend(p));
  roamMap.fitBounds(bounds,{padding:35,maxZoom:14});
  roamMap.on('load',()=>{if(!roamMap||document.getElementById('real-trip-map')!==el)return;
   roamMap.addSource('visit-order',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:positions},properties:{}}});
   roamMap.addLayer({id:'visit-order-line',type:'line',source:'visit-order',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#225e4b','line-width':3,'line-opacity':0.7,'line-dasharray':[2,3]}});
  });
 }else if(positions.length===1)roamMap.setCenter(positions[0]);
 setTimeout(()=>{if(document.getElementById('real-trip-map')===el)roamMap?.resize()},100);
}

function explore(){return `<main class="screen"><div class="eyebrow">READY-MADE ADVENTURES</div><h1 class="title">Explore a little more.</h1><p class="sub">Thoughtfully planned trips, ready when you are. Pick an itinerary, choose your dates, and make it yours.</p><div class="template-list">${travelTemplates.map(t=>`<button class="template-card" onclick="chooseTemplate('${t.id}')"><img src="${t.image}" alt="${esc(t.city)}" loading="lazy"><div class="template-body"><div class="template-kicker">${esc(t.country)} · ${t.days} days · ${esc(t.category)}</div><div class="template-title">${esc(t.title)}</div><p>${esc(t.subtitle)}</p><div class="template-tags"><span>${t.emoji} ${esc(t.theme)}</span><span><i data-lucide="compass" aria-hidden="true"></i> ${esc(t.pace)}</span><span><i data-lucide="credit-card" aria-hidden="true"></i> ${esc(t.budget)}</span></div><div class="template-cta">View this trip <span aria-hidden="true"><i data-lucide="arrow-right" aria-hidden="true"></i></span></div></div></button>`).join('')}</div></main>`}
function chooseTemplate(id){const t=travelTemplates.find(x=>x.id===id);if(!t)return;S.selectedTemplate=id;S.templateDraft=makeTemplateActivities(t,t.days);S.templatePreviewDay=1;S.templateError='';const base=S.startDate||'2026-11-12';S.templateStart=base;S.templateEnd=new Date(dateUTC(base)+(t.days-1)*86400000).toISOString().slice(0,10);S.page='template';render();window.scrollTo(0,0)}

function templatePage(){const t=travelTemplates.find(x=>x.id===S.selectedTemplate);if(!t)return explore();const duration=S.templateStart&&S.templateEnd?Math.round((dateUTC(S.templateEnd)-dateUTC(S.templateStart))/86400000)+1:0;const days=duration>0&&duration<=30?duration:t.days;const selected=Math.min(Math.max(S.templatePreviewDay||1,1),days);const activities=(S.templateDraft||[]).filter(a=>a.day===selected);const dayTitle=selected===1?'Discover '+t.city:selected===days?'One last day in '+t.city:'Explore '+t.city+' at your pace';return `<main class="screen"><button class="template-back" onclick="go('explore')"><i data-lucide="arrow-left" aria-hidden="true"></i> All itineraries</button><div class="eyebrow">CURATED TRIP · ${esc(t.country.toUpperCase())}</div><h1 class="title">${esc(t.title)}</h1><p class="sub">${esc(t.subtitle)}</p><img class="template-detail-image" src="${t.image}" alt="${esc(t.city)}"><div class="template-tags template-detail-tags"><span>${t.emoji} ${esc(t.theme)}</span><span><i data-lucide="compass" aria-hidden="true"></i> ${esc(t.pace)} pace</span><span><i data-lucide="credit-card" aria-hidden="true"></i> ${esc(t.budget)}</span></div><h2 class="sectionTitle">What's in your itinerary</h2><p class="small muted">Tap any activity to see details and customize your itinerary before adding it.</p><div class="daystrip">${Array.from({length:days},(_,i)=>`<button class="day ${selected===i+1?'active':''}" onclick="templatePreviewDay(${i+1})">DAY<strong>${i+1}</strong><span style="display:block;font-size:10px;margin-top:4px">${formatDate(new Date(dateUTC(S.templateStart)+(i)*86400000).toISOString().slice(0,10))}</span></button>`).join('')}</div><h2 class="sectionTitle" style="margin:14px 0">${esc(dayTitle)}</h2><div class="template-preview-activities">${activities.map(a=>visitActivityCard(a,'template')).join('')}</div><div class="panel template-book"><h2 class="sectionTitle">When are you traveling?</h2><p class="small muted">No flights or bookings. Just pick the dates for your plan.</p><div class="date-range"><div><label for="templateStart">Arrival</label><input class="input" id="templateStart" type="date" value="${esc(S.templateStart)}" onchange="updateTemplateDate('templateStart',this.value)"></div><div><label for="templateEnd">Departure</label><input class="input" id="templateEnd" type="date" min="${esc(S.templateStart)}" value="${esc(S.templateEnd)}" onchange="updateTemplateDate('templateEnd',this.value)"></div></div><p class="small ${S.templateError?'date-error':'muted'}">${S.templateError?esc(S.templateError):duration>0?`${duration} days · ${duration-1} nights`:'Choose your travel dates'}</p><button class="btn full" onclick="addTemplateTrip()"><i data-lucide="sparkles" aria-hidden="true"></i> Add to My Trips <i data-lucide="arrow-right" aria-hidden="true"></i></button></div></main>`}

function persistActiveTrip(){if(!S.tripCreated)return;const trip=snapshotTrip();const i=S.savedTrips.findIndex(x=>x.id===trip.id);if(i>=0)S.savedTrips[i]=trip;else S.savedTrips.unshift(trip)}

function addTemplateTrip(){const t=travelTemplates.find(x=>x.id===S.selectedTemplate);if(!t||!S.templateStart||!S.templateEnd){S.templateError='Select both travel dates.';render();return}const n=Math.round((dateUTC(S.templateEnd)-dateUTC(S.templateStart))/86400000)+1;if(n<1||n>30){S.templateError='Choose a valid date range of up to 30 days.';render();return}persistActiveTrip();S.activeTripId=uid();S.tripSource='template';S.destination=t.city;S.startDate=S.templateStart;S.endDate=S.templateEnd;S.days=n;S.theme=t.theme;S.pace=t.pace;S.budget=t.budget;S.travelers='Couple';S.activities=structuredClone(S.templateDraft||makeTemplateActivities(t,n)).filter(a=>a.day<=n);S.templateDraft=null;S.revision=1;S.history=[];S.revisionLog=[];S.tripCreated=true;S.day=1;S.view='timeline';persistActiveTrip();S.page='trips';render();window.scrollTo(0,0);toast('Your '+t.city+' trip is ready in My Trips <i data-lucide="sparkles" aria-hidden="true"></i>')}

function profile(){return `<main class="screen"><div class="eyebrow">MADE FOR YOU</div><h1 class="title">Your travel DNA.</h1><p class="sub">Your travel preferences, shaped by your choices. You stay in control.</p><div class="panel"><strong>Travel preferences</strong>${[['romantic','Romantic experiences'],['outdoors','Outdoor activities'],['museums','Museums & galleries']].map(([key,label])=>`<div class="row" style="padding:15px 0;border-bottom:1px solid var(--line)"><span class="small">${label}</span><input class="toggle" type="checkbox" ${S.profile[key]?'checked':''} onchange="S.profile.${key}=this.checked;render()"></div>`).join('')}<button class="btn ghost full" onclick="S.profile={romantic:false,outdoors:false,museums:false};render();toast('Preferences reset')">Reset preferences</button></div></main>`}
function trips(){if(S.tripCreated)persistActiveTrip();return `<main class="screen"><div class="eyebrow">YOUR COLLECTION</div><h1 class="title">Your adventures.</h1>${S.savedTrips.length?S.savedTrips.map(t=>`<div class="tripCard" onclick="openSavedTrip('${t.id}')"><img src="${(travelTemplates.find(x=>x.city===t.destination)||travelTemplates[0]).image}" alt="${esc(t.destination)}"><div class="content"><strong>${esc(t.destination)} · ${formatDate(t.startDate)} – ${formatDate(t.endDate)}</strong><p class="small muted">${t.days} days · ${t.activities.length} experiences</p><div class="trip-style-chips"><span class="trip-style-chip"><i data-lucide="compass" aria-hidden="true"></i> ${esc(t.pace)} pace</span><span class="trip-style-chip"><i data-lucide="sparkles" aria-hidden="true"></i> ${esc(t.theme)}</span><span class="trip-style-chip"><i data-lucide="credit-card" aria-hidden="true"></i> ${esc(t.budget)} budget</span></div><button class="btn secondary full">Open itinerary <i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div>`).join(''):`<div class="empty">No trips yet.<p>Explore a ready-made trip or create your own.</p><button class="btn" onclick="go('explore')">Explore trips</button></div>`}</main>`}
function openTemplateActivity(id){if(!(S.templateDraft||[]).some(a=>a.id===id))return;S.templateSelected=id;S.sheet='templateActivity';render()}
function templateActivitySheet(){const a=(S.templateDraft||[]).find(x=>x.id===S.templateSelected);if(!a)return '';const info=placeInfo(a);return `<h2 class="sectionTitle" style="margin-top:12px">${esc(a.title)}</h2><p class="sub">Day ${a.day} · ${esc(a.time)} · ${esc(a.desc)}</p>${ticketBookingRow(a,'template')}<div class="place-gallery">${info.photos.map((id,i)=>`<img loading="lazy" alt="Travel photo ${i+1}" src="https://images.unsplash.com/${id}?w=700&q=80" onerror="this.style.display='none'">`).join('')}</div><div class="panel"><strong>About this place</strong><p class="sub" style="margin-bottom:0">${esc(info.description)}</p></div><div class="lock-control"><div class="lock-control-label">${a.locked?'<i data-lucide="lock" aria-hidden="true"></i>':'<i data-lucide="lock-open" aria-hidden="true"></i>'} Lock activity <button class="help-icon" aria-label="About locking" onclick="openLockHelp()">?</button></div><input class="toggle" type="checkbox" aria-label="Lock this activity" ${a.locked?'checked':''} onchange="templateToggleLock('${a.id}')"></div><div class="template-action-row"><button class="chip" onclick="templateReplace('${a.id}')"><i data-lucide="sparkles" aria-hidden="true"></i> Ask AI to replace</button><button class="chip" onclick="templateMove('${a.id}')"><i data-lucide="arrow-up-right" aria-hidden="true"></i> Move to next day</button><button class="chip" onclick="templateRemove('${a.id}')"><i data-lucide="x" aria-hidden="true"></i> Remove</button></div><p class="footerNote">Your edits are saved in this preview. Add to My Trips when you're ready.</p>`}
function templateToggleLock(id){const a=S.templateDraft.find(x=>x.id===id);if(!a)return;a.locked=!a.locked;render();toast(a.locked?'Activity locked':'Activity unlocked')}
function templateReplace(id){const a=S.templateDraft.find(x=>x.id===id);if(!a)return;if(a.locked)return toast('Unlock this activity before replacing it');const options=a.mealType?['A charming neighborhood café','A local favorite restaurant','A relaxed dining experience']:['A scenic neighborhood walk','A local cultural discovery','A memorable hidden gem'];const index=(a.templateSwapIndex||0)%options.length;a.title=options[index];a.desc='Personalized alternative · suggested for your trip';a.templateSwapIndex=index+1;render();toast('Suggested replacement added to your preview <i data-lucide="sparkles" aria-hidden="true"></i>')}
function templateMove(id){const a=S.templateDraft.find(x=>x.id===id);if(!a)return;if(a.locked)return toast('Unlock this activity before moving it');const t=travelTemplates.find(x=>x.id===S.selectedTemplate);const days=S.templateStart&&S.templateEnd?Math.round((dateUTC(S.templateEnd)-dateUTC(S.templateStart))/86400000)+1:t.days;if(a.day>=days)return toast('This activity is already on the last day');a.day++;S.templatePreviewDay=a.day;S.sheet=null;render();toast('Activity moved to Day '+a.day)}
function templateRemove(id){const a=S.templateDraft.find(x=>x.id===id);if(!a)return;if(a.locked)return toast('Unlock this activity before removing it');S.templateDraft=S.templateDraft.filter(x=>x.id!==id);S.sheet=null;render();toast('Activity removed from your preview')}
function sheetContent(){let type=S.sheet;let content='';if(type==='templateActivity')content=templateActivitySheet();else if(type==='ai')content=aiSheet();else if(type==='activity')content=activitySheet();else if(type==='lockHelp')content=lockHelpSheet();else if(type==='proposal')content=proposalSheet();else if(type==='preferences')content=prefSheet();else if(type==='add')content=addSheet();else if(type==='revisions')content=revisionsSheet();else if(type==='share')content=`<h2 class="sectionTitle">Share your adventure</h2><p class="sub">Collaborative trip links, voting and live synchronization would be powered by your backend.</p><button class="btn full" onclick="copySummary()">Copy trip summary</button>`;else content=``;return `<div class="row"><span class="eyebrow">ROAM EXPERIENCE</span><button class="close" aria-label="Close sheet" onclick="closeSheet()"><i data-lucide="x" aria-hidden="true"></i></button></div>${content}`}
function aiSheet(){return `<h2 class="sectionTitle">Make it yours. <i data-lucide="sparkles" aria-hidden="true"></i></h2><p class="sub">Describe the feeling you want. Your itinerary stays in your control.</p><div class="chips">${['Make this day more romantic','Reduce walking','Make it budget-friendly','Add local food','Replace museums','Slow down the day'].map((s,i)=>`<button class="chip" onclick="$('aiPrompt').value=${JSON.stringify(s).replace(/"/g,'&quot;')}">${s}</button>`).join('')}</div><label class="field">Your instruction</label><textarea class="input" id="aiPrompt" rows="3" placeholder="Make this day more romantic..."></textarea><button class="btn full" style="margin-top:12px" onclick="makeProposal()"><i data-lucide="sparkles" aria-hidden="true"></i> Preview suggested changes</button><p class="footerNote">Demo: a local rule engine simulates structured Gemini output. No Gemini request is made.</p>`}
function makeProposal(){let prompt=($('aiPrompt')?.value||'').trim();if(!prompt){toast('Write an instruction first');return}let lower=prompt.toLowerCase();let day=S.day;let original=dayActs();let ops=[];let next=structuredClone(S.activities);let category='general';if(/romantic|couple|love|sunset/.test(lower)){category='romantic';if(day===2){let m=next.find(x=>x.id==='b1');if(m&&!m.locked){ops.push({type:'update',id:m.id,before:m.title,after:'Romantic Montmartre stroll'});m.title='Romantic Montmartre stroll';m.time='11:00'}let breakfast=next.find(x=>x.day===day&&x.mealType==='breakfast');if(breakfast&&!breakfast.locked){ops.push({type:'update',id:breakfast.id,before:breakfast.title,after:'Cozy Montmartre café breakfast'});breakfast.title='Cozy Montmartre café breakfast';breakfast.desc='Romantic café · 75 min · Venue unverified'}let dinner=next.find(x=>x.day===day&&x.mealType==='dinner');if(dinner&&!dinner.locked){ops.push({type:'update',id:dinner.id,before:dinner.title,after:'Intimate French dinner'});dinner.title='Intimate French dinner';dinner.desc='Candlelit dining · 90 min · Venue unverified'}}else{let x={id:uid(),day,time:'19:00',title:'Romantic evening experience',desc:'Venue to be verified · 90 min',category:'romantic',locked:false};next.push(x);ops.push({type:'add',after:x.title})}}else if(/walk|slow|relax|tired/.test(lower)){category='relaxed';let target=next.find(x=>x.day===day&&!x.locked);if(target){ops.push({type:'update',id:target.id,before:target.title,after:'Relaxed visit: '+target.title});target.title='Relaxed visit: '+target.title;target.desc='Flexible pace · 90 min'}}else if(/museum|replace/.test(lower)){category='outdoors';let target=next.find(x=>x.day===day&&!x.locked&&x.category==='culture')||next.find(x=>x.day===day&&!x.locked);if(target){ops.push({type:'update',id:target.id,before:target.title,after:'Scenic neighborhood exploration'});target.title='Scenic neighborhood exploration';target.desc='Outdoor alternative · 90 min';target.category='outdoors'}}else{let x={id:uid(),day,time:'16:30',title:/food|eat|restaurant/.test(lower)?'Local food discovery':'Personalized local experience',desc:'Suggested activity · availability unverified',category:'food',locked:false};next.push(x);ops.push({type:'add',after:x.title})}if(!ops.length){toast('No unlocked activity available for this edit');return}S.aiCalls++;S.proposal={prompt,category,day,baseRevision:S.revision,ops,next,original,validation:{locks:!S.activities.some(a=>a.locked&&JSON.stringify(a)!==JSON.stringify(next.find(x=>x.id===a.id))),overlap:checkOverlap(next.filter(a=>a.day===day)),places:false,routes:false,hours:false}};S.sheet='proposal';render()}
function checkOverlap(a){let times=a.map(x=>x.time);return new Set(times).size===times.length}
function proposalSheet(){let p=S.proposal;if(!p)return '';let valid=p.validation.locks&&p.validation.overlap;return `<h2 class="sectionTitle">A little more magic <i data-lucide="sparkles" aria-hidden="true"></i></h2><p class="sub">${esc(p.prompt)}</p><div class="panel"><div class="row"><strong>Suggested changes</strong><span class="tag">${p.ops.length} updates</span></div>${p.ops.map(op=>`<div class="change"><span class="tag ${op.type==='add'?'add':'edit'}">${op.type==='add'?'+ Add':'↻ Edit'}</span><div><strong>${esc(op.after)}</strong>${op.before?`<p>Previously: ${esc(op.before)}</p>`:''}</div></div>`).join('')}</div><button class="btn full" style="margin-top:18px" ${valid?'':'disabled'} onclick="applyProposal()"><i data-lucide="check" aria-hidden="true"></i> Apply suggested changes</button><button class="btn ghost full" style="margin-top:8px" onclick="S.sheet=S.proposal?.styleChanges?'preferences':S.proposal?.category==='experience'?'add':'ai';render()">Refine request</button>`}
function recordRevision(label){S.revisionLog.push({revision:S.revision,activities:structuredClone(S.activities),style:{pace:S.pace,budget:S.budget,theme:S.theme},label:label||'Itinerary updated'});}
function revisionsSheet(){const items=[{revision:S.revision,label:'Current itinerary',current:true},...S.revisionLog.slice().reverse()];return `<h2 class="sectionTitle">Version history</h2><p class="sub">Review earlier versions of your trip and restore one whenever you like.</p><div>${items.map(item=>`<button class="revision-item" ${item.current?'disabled aria-current="true"':`onclick="restoreRevision(${item.revision})"`}><span class="revision-icon">${item.current?'<i data-lucide="check" aria-hidden="true"></i>':'<i data-lucide="rotate-ccw" aria-hidden="true"></i>'}</span><span class="revision-copy"><strong>Revision ${item.revision}</strong><small>${esc(item.label)}</small></span><span class="revision-current">${item.current?'Current':'Restore <i data-lucide="arrow-right" aria-hidden="true"></i>'}</span></button>`).join('')}</div>${S.revisionLog.length?'':'<p class="sub">Your earlier versions will appear here after you make changes.</p>'}`}
function restoreRevision(revision){const entry=S.revisionLog.find(x=>x.revision===revision);if(!entry)return;recordRevision('Before restoring revision '+revision);S.activities=structuredClone(entry.activities);Object.assign(S,entry.style);S.revision++;S.sheet=null;S.proposal=null;render();toast('Revision '+revision+' restored')}
function applyProposal(){let p=S.proposal;if(!p||p.baseRevision!==S.revision)return toast('Proposal is outdated');if(!p.validation.locks||!p.validation.overlap)return toast('Validation failed');recordRevision('Before '+p.category+' changes');S.history.push(structuredClone(S.activities));S.activities=p.next;if(p.styleChanges)Object.assign(S,p.styleChanges);S.styleDraft=null;S.revision++;S.feedback.push('Accepted '+p.category+' itinerary change');S.proposal=null;S.sheet=null;render();toast('Changes applied · undo available')}
const photoSets={
 montmartre:['photo-1502602898657-3e91760cbb34','photo-1524504388940-b1c1722653e1'],
 louvre:['photo-1499856871958-5b9627545d1a','photo-1549144511-f099e773c147'],
 eiffel:['photo-1502602898657-3e91760cbb34','photo-1477959858617-67f85cf4f1df'],
 cafe:['photo-1509042239860-f550ce710b93','photo-1554118811-1e0d58224f24'],
 food:['photo-1517248135467-4c7edcad34c4','photo-1414235077428-338989a2e8c0'],
 outdoors:['photo-1499856871958-5b9627545d1a','photo-1500530855697-b586d89ba3ee'],
 default:['photo-1502602898657-3e91760cbb34','photo-1499856871958-5b9627545d1a']
};
function placeInfo(a){
 const t=a.title.toLowerCase();
 let key=t.includes('montmartre')||t.includes('sacré')?'montmartre':t.includes('louvre')?'louvre':t.includes('eiffel')?'eiffel':a.mealType==='breakfast'||t.includes('café')||t.includes('coffee')?'cafe':a.mealType||a.category==='food'?'food':a.category==='outdoors'?'outdoors':'default';
 let descriptions={montmartre:'Explore the charming hillside streets of Montmartre, known for its artists, intimate squares, and sweeping Paris views. Take your time discovering quiet corners and local cafés.',louvre:'The Louvre is one of the world’s best-known art museums, housed in a historic palace. Plan a focused visit around a few collections rather than trying to see everything.',eiffel:'The Eiffel Tower is Paris’s signature landmark. Nearby viewpoints and riverside walks offer beautiful perspectives, especially in the evening.',cafe:'Enjoy a relaxed Parisian café stop. Look for a cozy setting, freshly baked pastries, and time to linger before the next activity.',food:'Make this meal part of the experience: seek out a welcoming neighborhood restaurant, enjoy regional flavors, and leave enough time to dine without rushing.',outdoors:'Slow down and discover the city on foot. This stop is designed for scenic surroundings, fresh air, and a more flexible pace.',default:'Discover a memorable side of Paris at this stop. Enjoy the surroundings, explore at your own pace, and make time for spontaneous discoveries.'};
 return {description:descriptions[key],photos:photoSets[key]};
}
function activitySheet(){let a=S.activities.find(x=>x.id===S.selected);if(!a)return '';let info=placeInfo(a);return `<h2 class="sectionTitle" style="margin-top:12px">${esc(a.title)}</h2><p class="sub">Day ${a.day} · ${a.time} · ${esc(a.desc)}</p>${ticketBookingRow(a,'trip')}<div class="place-gallery" aria-label="Photos illustrating this experience">${info.photos.map((id,i)=>`<img loading="lazy" alt="Illustrative travel photograph ${i+1} for ${esc(a.title)}" src="https://images.unsplash.com/${id}?w=700&q=80" onerror="this.style.display='none'">`).join('')}</div><p class="footerNote" style="margin-top:0">Illustrative photography, not verified images of a specific venue.</p><div class="panel"><div class="row"><strong>About this place</strong><span class="tag">Travel guide</span></div><p class="sub" style="margin-bottom:0">${esc(info.description)}</p></div><div class="lock-control"><div class="lock-control-label"><span>${a.locked?'<i data-lucide="lock" aria-hidden="true"></i>':'<i data-lucide="lock-open" aria-hidden="true"></i>'} Lock activity</span><button class="help-icon" aria-label="What does locking an activity do?" title="About activity locking" onclick="openLockHelp()">?</button></div><input aria-label="Lock activity to prevent AI changes" type="checkbox" class="toggle" ${a.locked?'checked':''} onchange="toggleLock('${a.id}')"></div><div class="chips"><button class="chip" onclick="S.sheet='ai';render()"><i data-lucide="sparkles" aria-hidden="true"></i> Ask AI to replace</button><button class="chip" onclick="moveActivity('${a.id}')"><i data-lucide="arrow-up-right" aria-hidden="true"></i> Move to next day</button><button class="chip" onclick="removeActivity('${a.id}')"><i data-lucide="x" aria-hidden="true"></i> Remove</button></div>`}
function lockHelpSheet(){let a=S.activities.find(x=>x.id===S.selected);return `<div style="text-align:center;padding:20px 0 4px"><div style="font-size:34px"><i data-lucide="lock" aria-hidden="true"></i></div><h2 class="sectionTitle" style="margin:12px 0">Lock an activity</h2><p class="sub">Keep your must-do experiences exactly where you want them.</p></div><div class="panel"><strong>What happens when you lock it?</strong><ul class="lock-help-list"><li>AI won't remove, replace, or reschedule this activity automatically.</li><li>Other activities can still be rearranged around it.</li><li>You can unlock it anytime to make changes.</li></ul><p class="footerNote">Locking does not book a reservation or guarantee opening hours.</p></div><button class="btn full" onclick="closeLockHelp()">Got it</button>`}
function snapshot(){recordRevision('Before activity edit');S.history.push(structuredClone(S.activities));S.revision++;S.avoided++}function toggleLock(id){snapshot();let a=S.activities.find(x=>x.id===id);a.locked=!a.locked;S.feedback.push((a.locked?'Locked ':'Unlocked ')+a.category+' activity');S.sheet='activity';render();toast(a.locked?'Activity locked':'Activity unlocked')}
function moveActivity(id){let a=S.activities.find(x=>x.id===id);if(a.locked)return toast('Unlock before moving');snapshot();a.day=a.day===S.days?1:a.day+1;S.feedback.push('Moved '+a.category+' activity');S.sheet=null;render();toast('Activity moved')}
function removeActivity(id){let a=S.activities.find(x=>x.id===id);if(a.locked)return toast('Unlock before removing');snapshot();S.feedback.push('Removed '+a.category+' activity');S.activities=S.activities.filter(x=>x.id!==id);S.sheet=null;render();toast('Removed · Undo available')}
function undo(){if(!S.history.length)return;recordRevision('Before undo');S.activities=S.history.pop();S.revision++;S.avoided++;render();toast('Previous itinerary restored')}
function addSheet(){return `<h2 class="sectionTitle">Add an experience <i data-lucide="sparkles" aria-hidden="true"></i></h2><p class="sub">What do you feel like doing? Tell AI what you're in the mood for, and we'll suggest something for Day ${S.day}.</p><label class="field" for="experiencePrompt">What do you like to do?</label><textarea class="input" id="experiencePrompt" rows="3" placeholder="e.g. I'd love a cozy pastry tasting, somewhere locals go..."></textarea><div class="chips" style="margin-top:12px">${['Try local food','Discover art','Spend time outdoors','Explore local markets'].map(x=>`<button class="chip" onclick="$('experiencePrompt').value=${JSON.stringify(x).replace(/"/g,'&quot;')};$('experiencePrompt').focus()">${fa(({ 'Try local food':'utensils','Discover art':'palette','Spend time outdoors':'tree','Explore local markets':'shopping-bag'})[x])} ${x}</button>`).join('')}</div><button class="btn full" style="margin-top:18px" onclick="suggestExperience()"><i data-lucide="sparkles" aria-hidden="true"></i> Find an experience</button><p class="footerNote">Suggestions are simulated in this demo. A connected AI service can recommend real venues and availability.</p>`}
function suggestExperience(){const prompt=($('experiencePrompt')?.value||'').trim();if(!prompt)return toast('Tell us what you would like to do');const q=prompt.toLowerCase();let title='A personalized local discovery',category='custom',desc='A unique experience inspired by your interests';if(/food|pastr|baker|eat|dessert|coffee|cafe|café|cook|taste/.test(q)){title='Discover a neighborhood food favorite';category='food';desc='Explore local flavors and a relaxed tasting experience'}else if(/art|museum|gallery|history|culture/.test(q)){title='Explore a local art and culture gem';category='culture';desc='Discover art, history, and stories from the neighborhood'}else if(/outdoor|park|nature|garden|walk|hike/.test(q)){title='Explore a scenic local escape';category='outdoors';desc='Enjoy an easygoing outdoor experience'}else if(/market|shop|vintage|boutique/.test(q)){title='Wander a charming local market';category='shopping';desc='Browse independent shops and neighborhood finds'}else if(/romantic|sunset|couple/.test(q)){title='Enjoy a romantic sunset experience';category='romantic';desc='A memorable, unhurried moment together'}const taken=new Set(S.activities.filter(x=>x.day===S.day).map(x=>x.time));let time=['16:30','15:30','17:30','14:30','18:30'].find(x=>!taken.has(x))||'16:30';const activity={id:uid(),day:S.day,time,title,desc:desc+' · Suggested for: '+prompt,category,locked:false};const next=structuredClone(S.activities);next.push(activity);S.aiCalls++;S.proposal={prompt:'Add an experience: '+prompt,category:'experience',day:S.day,baseRevision:S.revision,ops:[{type:'add',after:title}],next,validation:{locks:true,overlap:checkOverlap(next.filter(a=>a.day===S.day)),places:false,routes:false,hours:false}};S.sheet='proposal';render()}
function prefSheet(){const p=S.styleDraft||{pace:S.pace,budget:S.budget,theme:S.theme};return `<h2 class="sectionTitle">Your trip style</h2><p class="sub">Changing your style asks AI to rethink your itinerary. Review the proposed changes before applying.</p>${[['pace','Pace',['Relaxed','Balanced','Packed']],['budget','Budget',['Budget','Moderate','Comfortable','Luxury']],['theme','Travel mood',['Romantic','Cultural','Adventure','Foodie','Relaxed','Family-friendly']]].map(([key,label,options])=>`<label class="field">${label}</label><div class="chips">${options.map(x=>`<button class="chip ${p[key]===x?'active':''}" onclick="setStyleDraft('${key}','${x}')">${x}</button>`).join('')}</div>`).join('')}<button class="btn full" style="margin-top:18px" onclick="previewStyleChange()"><i data-lucide="sparkles" aria-hidden="true"></i> Preview AI itinerary changes</button><p class="footerNote">Locked activities stay unchanged. This demo simulates AI edits locally.</p>`}
function setStyleDraft(key,value){if(!S.styleDraft)S.styleDraft={pace:S.pace,budget:S.budget,theme:S.theme};S.styleDraft[key]=value;render()}
function previewStyleChange(){const draft=S.styleDraft||{pace:S.pace,budget:S.budget,theme:S.theme};const changed=['pace','budget','theme'].filter(k=>draft[k]!==S[k]);if(!changed.length)return toast('Choose a different trip style first');const next=structuredClone(S.activities),ops=[];const mood=draft.theme;const mealWords={Budget:'Neighborhood café or affordable local meal',Moderate:'Local restaurant experience',Comfortable:'Comfortable neighborhood dining',Luxury:'Special dining experience'};for(let day=1;day<=S.days;day++){const available=next.filter(a=>a.day===day&&!a.locked);if(!available.length)continue;let target=available.find(a=>!a.mealType)||available[0];if(changed.includes('theme')&&target){const names={Romantic:'Scenic romantic experience',Cultural:'Local art and cultural discovery',Adventure:'Active neighborhood adventure',Foodie:'Local flavors and food discovery',Relaxed:'Unhurried scenic exploration','Family-friendly':'Family-friendly discovery'};const title=names[mood]||'Personalized local experience';if(target.title!==title){ops.push({type:'update',id:target.id,before:target.title,after:title});target.title=title;target.desc=`${mood} experience · venue and timing unverified`;target.category='custom'}}if(changed.includes('budget')){const meal=available.find(a=>a.mealType==='dinner')||available.find(a=>a.mealType==='lunch');if(meal){const title=mealWords[draft.budget]||'Local restaurant experience';if(meal.title!==title){ops.push({type:'update',id:meal.id,before:meal.title,after:title});meal.title=title;meal.desc=`${draft.budget} dining · venue unverified`}}}if(changed.includes('pace')){const activity=available.find(a=>!a.mealType&&a.id!==target?.id)||target;if(activity){const prefix=draft.pace==='Relaxed'?'Slow-paced':draft.pace==='Packed'?'Full-day':'Balanced';const title=`${prefix}: ${activity.title.replace(/^(Slow-paced|Full-day|Balanced): /,'')}`;if(title!==activity.title){ops.push({type:'update',id:activity.id,before:activity.title,after:title});activity.title=title;activity.desc=`${draft.pace} pace · timings to be verified`}}}}if(!ops.length)return toast('All relevant activities are locked; unlock one to change the plan');const locks=!S.activities.some(a=>a.locked&&JSON.stringify(a)!==JSON.stringify(next.find(x=>x.id===a.id)));const overlap=Array.from({length:S.days},(_,i)=>checkOverlap(next.filter(a=>a.day===i+1))).every(Boolean);S.aiCalls++;S.proposal={prompt:'Update my entire trip: '+changed.map(k=>`${k} from ${S[k]} to ${draft[k]}`).join('; '),category:'trip style',day:null,baseRevision:S.revision,ops,next,styleChanges:Object.fromEntries(changed.map(k=>[k,draft[k]])),validation:{locks,overlap,places:false,routes:false,hours:false}};S.sheet='proposal';render()}
function copySummary(){let text=`${S.destination} — ${formatDate(S.startDate)} to ${formatDate(S.endDate)} (${S.days} days)\n`+S.activities.map(a=>`Day ${a.day}, ${a.time}: ${a.title}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Summary copied')).catch(()=>toast('Copy unavailable'));else toast('Clipboard unavailable')}
function go(page){if(S.page==='trip'&&page!=='trip')persistActiveTrip();S.page=page;S.sheet=null;render();window.scrollTo(0,0)}// Official booking destinations reviewed 2026-10-31. Never infer a sale or availability from a click.
const visitTicketCatalog = [
  {id:'louvre',city:'paris',aliases:['Louvre','Louvre Museum'],provider:'Louvre Museum',mode:'online',url:'https://ticket.louvre.fr/en',note:'Choose the admission type and entry time that fit your visit.'},
  {id:'eiffel',city:'paris',aliases:['Eiffel Tower'],provider:'Eiffel Tower',mode:'online',url:'https://ticket.toureiffel.paris/en',note:'Choose your floor and stairs or lift access on the official ticket site.'},
  {id:'arc',city:'paris',aliases:['Arc de Triomphe'],provider:'Arc de Triomphe',mode:'online',url:'https://www.paris-arc-de-triomphe.fr/en',note:'Book monument and terrace access through the official website.'},
  {id:'cruise',city:'paris',aliases:['Seine sunset cruise','Seine river cruise','Sunset Seine river cruise'],provider:'Bateaux Parisiens',mode:'online',operator:true,url:'https://www.bateauxparisiens.com/en/cruise-tours/guided-tour.html',note:'One cruise option for this visit. Check the boarding point and departure time before booking.'},
  {id:'sacre',city:'paris',aliases:['Sacre-Coeur Basilica','Sacre-Coeur'],provider:'Sacre-Coeur Basilica',mode:'onsite',url:'https://www.sacre-coeur-montmartre.com/en/info-and-visits/the-dome-tour/',note:'The basilica is free to enter. The optional dome visit needs a separate ticket, sold at the venue rather than online.'},
  {id:'colosseum',city:'rome',aliases:['Colosseum','Roman Forum'],provider:'Colosseum Archaeological Park',mode:'online',url:'https://ticketing.colosseo.it/en/',note:'Check the areas included in your ticket. A Colosseum ticket may already cover your Roman Forum visit.'},
  {id:'pantheon',city:'rome',aliases:['Pantheon'],provider:'Pantheon / Musei Italiani',mode:'online',url:'https://direzionemuseiroma.cultura.gov.it/en/pantheon/',note:'Follow the official Ticket Purchase link to choose your admission and time slot.'},
  {id:'sagrada',city:'barcelona',aliases:['Sagrada Familia'],provider:'Sagrada Familia',mode:'online',url:'https://sagradafamilia.org/en/tickets',note:'Choose basilica admission, a guided visit or a tower option on the official site.'},
  {id:'guell',city:'barcelona',aliases:['Park Guell'],provider:'Park Guell',mode:'online',url:'https://parkguell.barcelona/en/buy-tickets',note:'Choose your visit type and timed entry on the official site.'},
  {id:'batllo',city:'barcelona',aliases:['Casa Batllo'],provider:'Casa Batllo',mode:'online',url:'https://www.casabatllo.es/en/online-tickets/',note:'Compare the available visit options and choose the one that fits your day.'},
  {id:'kiyomizu',city:'kyoto',aliases:['Kiyomizu-dera','Kiyomizu-dera Temple'],provider:'Kiyomizu-dera Temple',mode:'info',url:'https://www.kiyomizudera.or.jp/en/visit/',note:'Check the temple\'s official visitor information for admission arrangements. Online checkout is not connected for this visit.'}
];
function normalizeVisitName(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0153/g,'oe').replace(/[\u2010-\u2015]/g,'-').toLowerCase().trim()}
function visitContext(scope){const t=scope==='template'?travelTemplates.find(x=>x.id===S.selectedTemplate):null;return {city:t?t.city:S.destination,start:scope==='template'?S.templateStart:S.startDate,activities:scope==='template'?(S.templateDraft||[]):S.activities}}
function ticketForVisit(activity,scope='trip'){
  if(!activity||activity.mealType||activity.category==='food')return null;
  const city=normalizeVisitName(visitContext(scope).city).split(',')[0].trim();
  const name=normalizeVisitName(activity.title).replace(/^(?:(?:slow-paced|full-day|balanced|relaxed visit):\s*)+/,'');
  return visitTicketCatalog.find(t=>t.city===city&&t.aliases.some(alias=>normalizeVisitName(alias)===name))||null;
}
function visitTicketIcon(){return fa('ticket')}
function visitAction(id,scope,fn){return `${fn}(${esc(JSON.stringify(id))},${esc(JSON.stringify(scope))})`}
function ticketActionLabel(ticket){return ticket.mode==='online'?'Buy tickets':ticket.mode==='onsite'?'Admission details':'Visitor information'}
function visitActivityCard(a,scope='trip'){
  const ticket=ticketForVisit(a,scope);
  return `<div class="activity visit-card"><button type="button" class="visit-card-main" onclick="${visitAction(a.id,scope,'openVisitDetails')}" aria-label="${esc('View '+a.title)}"><span class="time">${esc(a.time)}</span><span class="activityMain"><strong>${esc(a.title)} ${a.locked?fa('lock'):''}</strong><span class="visit-card-description">${esc(a.desc)}</span></span><span class="visit-chevron" aria-hidden="true"><i data-lucide="chevron-right" aria-hidden="true"></i></span></button>${ticket?`<div class="visit-card-footer"><button type="button" class="visit-ticket-button" onclick="${visitAction(a.id,scope,'openVisitTickets')}" aria-label="${esc(ticketActionLabel(ticket)+' for '+a.title)}">${visitTicketIcon()}<span>${ticketActionLabel(ticket)}</span><span class="visit-chevron" aria-hidden="true"><i data-lucide="chevron-right" aria-hidden="true"></i></span></button></div>`:''}</div>`;
}
function openVisitDetails(id,scope='trip'){S.ticketTarget=null;if(scope==='template'){S.templateSelected=id;openSheet('templateActivity')}else{S.selected=id;openSheet('activity')}}
function ticketBookingRow(a,scope='trip'){
  const ticket=ticketForVisit(a,scope);if(!ticket)return '';
  return `<button type="button" class="visit-booking-row" onclick="${visitAction(a.id,scope,'openVisitTickets')}"><span class="visit-booking-icon">${visitTicketIcon()}</span><span class="visit-booking-copy"><strong>${ticketActionLabel(ticket)}</strong><small>${ticket.operator?'Cruise operator':ticket.mode==='online'?'Official ticket website':'Official visitor information'}</small></span><span class="visit-chevron" aria-hidden="true"><i data-lucide="chevron-right" aria-hidden="true"></i></span></button>`;
}
function openVisitTickets(id,scope='trip'){
  if(!['trip','template'].includes(scope))return;
  const a=visitContext(scope).activities.find(x=>x.id===id);if(!ticketForVisit(a,scope))return;
  const sheet=scope==='template'?'templateActivity':'activity';
  if(S.sheet!==sheet||(scope==='template'?S.templateSelected:S.selected)!==id){
    if(scope==='template')S.templateSelected=id;else S.selected=id;
    S.sheet=sheet;S.ticketTarget=null;render();
    // Allow the parent Vaul drawer to mount before opening its nested sheet.
    requestAnimationFrame(()=>{if(S.sheet===sheet&&(scope==='template'?S.templateSelected:S.selected)===id){S.ticketTarget={id,scope};window.dispatchEvent(new Event('roam:sheet-update'))}});
  }else{S.lockHelpOpen=false;S.ticketTarget={id,scope};window.dispatchEvent(new Event('roam:sheet-update'))}
}
function closeVisitTickets(){S.ticketTarget=null;window.dispatchEvent(new Event('roam:sheet-update'))}
function visitDateLabel(a,scope){
  const start=visitContext(scope).start;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start||'')||!Number.isInteger(a.day)||a.day<1)return 'Choose your trip dates';
  const date=new Date(dateUTC(start)+(a.day-1)*86400000);
  return Number.isNaN(date.getTime())?'Choose your trip dates':date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
}
function visitTicketsSheet(){
  const target=S.ticketTarget;if(!target)return '';
  const context=visitContext(target.scope),a=context.activities.find(x=>x.id===target.id),ticket=ticketForVisit(a,target.scope);
  if(!ticket)return `<p class="sub">Ticket information is no longer available for this visit.</p><button class="btn full" onclick="closeVisitTickets()">Back to activity</button>`;
  const online=ticket.mode==='online';
  const subtitle=ticket.operator?'Cruise option':online?'Official booking':'Plan your visit';
  return `<div class="visit-ticket-header"><span class="visit-ticket-eyebrow">${visitTicketIcon()} ${subtitle}</span><button type="button" class="visit-ticket-close" onclick="closeVisitTickets()" aria-label="Close ticket details"><i data-lucide="x" aria-hidden="true"></i></button></div><h2 id="visit-ticket-heading" class="visit-ticket-heading" tabindex="-1">${esc(a.title)}</h2><p class="visit-ticket-intro">${online?'Make this stop part of your adventure.':'Everything you need before you visit.'}</p><div class="visit-ticket-stub"><div class="visit-ticket-stub-top"><span>PLANNED VISIT</span><strong>${esc(context.city)} &middot; Day ${a.day}</strong></div><div class="visit-ticket-schedule"><div><small>Date</small><strong>${esc(visitDateLabel(a,target.scope))}</strong></div><div><small>Local time</small><strong>${esc(a.time||'Flexible')}</strong></div></div><div class="visit-ticket-provider"><span class="visit-booking-icon">${visitTicketIcon()}</span><div><strong>${esc(ticket.provider)}</strong><small>${esc(new URL(ticket.url).hostname.replace(/^www\./,''))}</small></div></div></div><p class="visit-ticket-note">${esc(ticket.note)}</p><a class="btn full visit-ticket-checkout" href="${esc(ticket.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc((online?'Buy tickets':'View visitor information')+' for '+a.title+' (opens a new tab)')}">${online?'Buy tickets':'View visitor information'} <span aria-hidden="true"><i data-lucide="arrow-up-right" aria-hidden="true"></i></span></a><p class="visit-ticket-handoff">${online?'Opens the ticket website. Select your date and time there; prices and availability are confirmed by the seller.':'Opens the venue\'s official website in a new tab.'}</p><button type="button" class="visit-ticket-back" onclick="closeVisitTickets()">Back to activity</button>`;
}

function openSheet(type){S.ticketTarget=null;if(type==='preferences')S.styleDraft={pace:S.pace,budget:S.budget,theme:S.theme};S.sheet=type;render()}function closeSheet(){S.ticketTarget=null;S.lockHelpOpen=false;S.sheet=null;render()}function openLockHelp(){S.lockHelpOpen=true;render()}function closeLockHelp(){S.lockHelpOpen=false;render()}render();
</script>
